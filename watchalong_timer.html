<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>同時視聴タイマー</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app {
      background: #1c1c1c;
      padding: 24px 32px;
      border-radius: 12px;
      width: 320px;
    }
    h1 {
      font-size: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    label {
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
    }
    .time {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 16px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .controls .supplementText {
      color: #888;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      box-shadow: 0 4px 0 #222;
    }
    button:active,
    button.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #222;
    }
    .start { background: #2ecc71; }
    .pause { background: #f1c40f; }
    .reset { background: #e74c3c; }

    #helpOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #helpPanel {
      background: #1c1c1c;
      padding: 24px 28px;
      border-radius: 12px;
      width: 300px;
      color: #fff;
    }

    #helpPanel h2 {
      margin-top: 0;
      font-size: 18px;
    }

    #helpPanel ul {
      padding-left: 18px;
    }

    #helpPanel li {
      margin: 8px 0;
    }

    #helpPanel .hint {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎬 同時視聴タイマー</h1>

    <label>映画の長さ（分:秒 または 時:分:秒）</label>
    <input type="text" id="durationInput" placeholder="例：2:22:03">

    <div class="time">
      <div>経過時間<br><strong id="elapsed">00:00:00</strong></div>
      <div>残り時間<br><strong id="remaining">00:00:00</strong></div>
    </div>

    <div class="controls">
      <button class="start" id="startBtn">開始</button>
      <button class="pause" id="pauseBtn">一時停止</button>
      <button class="reset" id="resetBtn">リセット</button>
    </div>

    <div class="controls">
      <button id="plus1m">＋1分</button>
      <button id="plus10s">＋10秒</button>
      <button id="plus1s">＋1秒</button>
    </div>

    <div class="controls">
      <button id="minus1m">−1分</button>
      <button id="minus10s">−10秒</button>
      <button id="minus1s">−1秒</button>
    </div>

    <div class="controls">
      <div class="supplementText"><strong>?</strong>キーでショートカットキーのヘルプを表示</div>
    </div>

    <div id="helpOverlay" style="display:none;">
      <div id="helpPanel">
        <h2>⌨ キーボードショートカット</h2>
        <ul>
          <li><strong>← / → または a / d</strong>：±1秒</li>
          <li><strong>Shift + ← / → または A / D</strong>：±10秒</li>
          <li><strong>↑ / ↓ または w / s</strong>：±1分</li>
          <li><strong>Space</strong>：再生 / 一時停止</li>
          <li><strong>?</strong>：このヘルプを表示</li>
          <li><strong>Esc</strong>：閉じる</li>
        </ul>
        <p class="hint">※ 画面クリックでも閉じられます</p>
      </div>
    </div>
  </div>

  <script>
    let totalSeconds = 0;
    let elapsedSeconds = 0;
    let timerId = null;

    const elapsedEl = document.getElementById("elapsed");
    const remainingEl = document.getElementById("remaining");
    const helpOverlay = document.getElementById("helpOverlay");

    function parseDuration(value) {
      const parts = value.split(":").map(Number);
      if (parts.length === 2) {
        // mm:ss形式
        return parts[0] * 60 + parts[1];
      }
      else if (parts.length === 3) {
        // hh:mm:ss形式
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }
      return 0;
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function updateDisplay() {
      elapsedEl.textContent = formatTime(elapsedSeconds);
      remainingEl.textContent = formatTime(
        Math.max(totalSeconds - elapsedSeconds, 0)
      );
    }

    function jump(seconds) {
      elapsedSeconds += seconds;

      if (elapsedSeconds < 0) elapsedSeconds = 0;
      if (elapsedSeconds > totalSeconds) elapsedSeconds = totalSeconds;

      updateDisplay();
    }

    function togglePlayPause() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        pressButton("pauseBtn");
      } else {
        document.getElementById("startBtn").click();
      }
    }

    function toggleHelp() {
      helpOverlay.style.display =
        helpOverlay.style.display === "none" ? "flex" : "none";
    }

    function pressButton(id) {
      const btn = document.getElementById(id);
      if (!btn) return;

      btn.classList.add("pressed");
      setTimeout(() => {
        btn.classList.remove("pressed");
      }, 100);
    }

    function resetAll() {
      clearInterval(timerId);
      timerId = null;
      elapsedSeconds = 0;
      totalSeconds = 0;
      updateDisplay();
    }

    document.getElementById("startBtn").onclick = (event) => {
      if (timerId) return;

      if (totalSeconds === 0) {
        const input = document.getElementById("durationInput").value;
        totalSeconds = parseDuration(input);
        updateDisplay();
      }

      timerId = setInterval(() => {
        elapsedSeconds++;
        updateDisplay();

        if (elapsedSeconds >= totalSeconds) {
          clearInterval(timerId);
          timerId = null;
        }
      }, 1000);
      
      pressButton(event.currentTarget.id);
    };

    document.getElementById("pauseBtn").onclick = (event) => {
      clearInterval(timerId);
      timerId = null;
      pressButton(event.currentTarget.id);
    };

    document.getElementById("resetBtn").onclick = (event) => {
      resetAll();
      pressButton(event.currentTarget.id);
    };

    document.getElementById("minus10s").onclick = (event) => {
      jump(-10);
      pressButton(event.currentTarget.id);
    }
    document.getElementById("plus10s").onclick  = (event) => {
      jump(10);
      pressButton(event.currentTarget.id);
    }
    document.getElementById("minus1s").onclick = (event) => {
      jump(-1);
      pressButton(event.currentTarget.id);
    }
    document.getElementById("plus1s").onclick  = (event) => {
      jump(1);
      pressButton(event.currentTarget.id);
    }
    document.getElementById("minus1m").onclick  = (event) => {
      jump(-60);
      pressButton(event.currentTarget.id);
    }
    document.getElementById("plus1m").onclick   = (event) => {
      jump(60);
      pressButton(event.currentTarget.id);
    }

    document.addEventListener("keydown", (e) => {
      // 入力中は無効化
      if (e.target.tagName === "INPUT") return;

      switch (e.key) {
        case "ArrowLeft":
        case "a":
        case "A":
          e.preventDefault();
          jump(e.shiftKey ? -10 : -1);
          break;

        case "ArrowRight":
        case "d":
        case "D":
          e.preventDefault();
          jump(e.shiftKey ? 10 : 1);
          break;

        case "ArrowUp":
        case "w":
          e.preventDefault();
          jump(60);
          break;

        case "ArrowDown":
        case "s":
          e.preventDefault();
          jump(-60);
          break;

        case " ":
          e.preventDefault();
          togglePlayPause();
          break;

        case "r":
        case "R":
          e.preventDefault();
          resetAll();
          pressButton("resetBtn");
          break;

        case "?":
          e.preventDefault();
          toggleHelp();
          break;

        case "Escape":
          e.preventDefault();
          if (helpOverlay.style.display === "none") {
            // do nothing
          } else {
            helpOverlay.style.display = "none";
          }
          break;
      }
    });

    // クリックで閉じる
    helpOverlay.addEventListener("click", () => {
      helpOverlay.style.display = "none";
    });
  </script>
</body>
</html>
